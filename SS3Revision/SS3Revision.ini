; SS3Revision settings. Place this file next to dinput8.dll in the game folder
; (Sudden Strike 3: SS3Game.exe, Last Stand: SSTLSGame.exe).

[General]
; Write SS3Revision.log next to the DLL, listing the detected game and the applied features.
Log=0

[Resolution]
; Additional resolutions for the options menu.
; They require a Direct3D 9 wrapper that presents the game in a window mode.
Modes=960x540,1920x540,960x720

; Resolution used at startup regardless of the player profile. Leave empty to use the profile.
Force=
